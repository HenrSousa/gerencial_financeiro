<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerencial Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Escala tipográfica única: t1 legendas, t2 rótulos, t3 texto e números, t4 títulos de card, t5 títulos, t6 KPIs */
:root{--t1:clamp(11px,.64vw,12.5px);--t2:clamp(12px,.69vw,13.5px);--t3:clamp(12.5px,.74vw,14.5px);--t4:clamp(14px,.82vw,16px);--t5:clamp(17px,1.05vw,21px);--t6:clamp(20px,1.3vw,26px)}
.chart svg text,.ytd svg text{font-size:var(--t1)}
.box b{font-size:var(--t3)}

/* Layout: barra superior + filtros; resumo; matriz à esquerda ocupando a altura toda e histórico em linhas à direita; detalhe da classe gerencial em painel lateral */
:root{
  --bg:#F6F7F6; --surface:#FFFFFF; --head:#F8F8F8; --fg:#222826; --muted:#7A807D; --line:#E4E6E4;
  --accent:#36A535; --accent-ink:#FFFFFF; --accent-soft:#EAF6EA; --link:#1B7FC4;
  --pag:#E3962A; --neg:#C8443A; --track:#ECEDEC; --hover:#FAFBFA; --ly:#A9AFAC;
  --tip:#2B3240; --tip-fg:#F3F5F8; --shadow:0 6px 24px rgba(20,30,25,.12); --scrim:rgba(30,34,32,.55);
  --f-ui:"Lato","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131614; --surface:#1B1F1D; --head:#202523; --fg:#E8ECEA; --muted:#98A19C; --line:#2C3330;
  --accent:#4CBF4B; --accent-ink:#0D190D; --accent-soft:#1F3320; --link:#62B1E8;
  --pag:#EDA845; --neg:#F07B70; --track:#2A302D; --hover:#1F2421; --ly:#5E6762;
  --tip:#E8ECEA; --tip-fg:#151816; --shadow:0 6px 24px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1B1F1D; --head:#202523; --fg:#E8ECEA; --muted:#98A19C; --line:#2C3330;
  --accent:#4CBF4B; --accent-ink:#0D190D; --accent-soft:#1F3320; --link:#62B1E8;
  --pag:#EDA845; --neg:#F07B70; --track:#2A302D; --hover:#1F2421; --ly:#5E6762;
  --tip:#E8ECEA; --tip-fg:#151816; --shadow:0 6px 24px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:var(--t3)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.pad{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1920px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.btn{height:32px;padding:0 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:var(--t2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--accent)} .down{color:var(--neg)}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--t5);letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}

/* Filtros */
.filters{background:var(--surface);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.filters .lbl{font-size:var(--t2);color:var(--muted);font-weight:700;margin-right:4px}
.dd{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--t2);max-width:280px}
.dd:hover{background:var(--hover)}
.dd .k{color:var(--muted)}
.dd .v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd svg{flex:none;color:var(--muted)}
.clear{background:none;border:0;color:var(--link);cursor:pointer;font-size:var(--t2);padding:6px}
.pop{position:fixed;z-index:40;width:300px;max-height:420px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.pop-s{padding:10px;border-bottom:1px solid var(--line)}
.pop-s input{width:100%;height:34px;border:1px solid var(--line);border-radius:3px;padding:0 10px;background:var(--bg)}
.pop-q{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.qb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:var(--t1);cursor:pointer}
.qb:hover{border-color:var(--accent);color:var(--accent)}
.opts{overflow:auto;padding:6px 0;flex:1}
.opt{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;font-size:var(--t2)}
.opt:hover{background:var(--hover)}
.opt input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.opt.all{font-weight:700;border-bottom:1px solid var(--line)}
.opt.yr{font-weight:700;color:var(--muted);font-size:var(--t1);padding-top:10px}
.opt.sub{padding-left:30px}
.pop-f{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line)}
.linkbtn{background:none;border:0;color:var(--link);cursor:pointer;font-size:var(--t2);padding:4px}

/* Conteúdo */
.content{padding-block:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.ttl h1{margin:0;font-size:var(--t5);font-weight:700}
.ttl p{margin:4px 0 0;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:18px 0}
.kpi{padding:0 24px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{color:var(--muted);font-size:var(--t2)}
.kpi .v{font-size:var(--t6);font-variant-numeric:tabular-nums}
.kpi .d{font-size:var(--t1);color:var(--muted)}
.kpi.ring{flex-direction:row;align-items:center;gap:16px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:16px;height:clamp(480px,calc(100vh - 370px),780px)}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:var(--t4);font-weight:700}
.ph small{display:block;color:var(--muted);font-size:var(--t1);margin-top:3px}
.ph-tools{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:var(--t2);cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* Matriz */
.mx-wrap{overflow:auto;min-height:0;flex:1;border-top:1px solid var(--line)}
table.mx{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.mx th{position:sticky;top:0;background:var(--head);z-index:2;text-align:right;font-weight:700;color:var(--muted);font-size:var(--t1);padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap;height:44px}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:20px}
.mx td{padding:8px 18px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface)}
.mx tr.s td{height:58px}
.mx tr.g td{height:58px;background:var(--hover);font-size:var(--t3)}
.mx tr.fill td{height:0;padding:0;border-bottom:0;background:var(--surface)}
.mx tr.g{cursor:pointer}
.mx tr.g:hover td{background:var(--accent-soft)}
.mx tr.g td:first-child{padding-left:58px}
.mx tr.g .gn{color:var(--link)}
.mx tr.s td:first-child{font-weight:700;font-size:var(--t3)}
.mx.mv td:first-child,.mx.mv th:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.mx.mv th:first-child{z-index:3}
.mx.mv th.tot,.mx.mv td.tot{font-weight:700;border-left:1px solid var(--line);text-align:center}
.nm{display:flex;align-items:center;gap:12px}
.nm .sub{display:block;font-size:var(--t1);color:var(--muted);font-weight:400;margin-top:3px}
.exp{width:26px;height:26px;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.exp svg{transition:transform .15s}
.exp.open svg{transform:rotate(90deg)}
.dash{color:var(--muted)}
.mx tfoot td{position:sticky;bottom:0;background:var(--head);font-weight:700;height:50px;border-top:1px solid var(--line);z-index:1}
.mx.mv tfoot td:first-child{z-index:3}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Lateral */
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.side>.card{flex:1;min-height:0}
.chart{flex:1;min-height:0;padding:0 14px 10px;position:relative}
.chart svg{display:block;width:100%;height:100%}
.legend{display:flex;gap:14px;font-size:var(--t1);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dsh{background:repeating-linear-gradient(90deg,var(--ly) 0 4px,transparent 4px 7px)!important}
.list{overflow:auto;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line)}
.li .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n small{display:block;color:var(--muted);font-weight:400;font-size:var(--t1);margin-top:2px}
.li .val{text-align:right;font-variant-numeric:tabular-nums}
.li .val small{display:block;color:var(--muted);font-size:var(--t1);margin-top:2px}
.tip{position:fixed;pointer-events:none;background:var(--tip);color:var(--tip-fg);padding:10px 12px;border-radius:4px;font-size:var(--t1);line-height:1.55;z-index:80;font-variant-numeric:tabular-nums}

/* Painel da classe gerencial */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100%;background:var(--surface);z-index:60;overflow:auto;padding:24px 26px calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(26px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.dr-close{position:fixed;top:20px;right:616px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#333;cursor:pointer;display:grid;place-items:center;z-index:61}
.dr-h small{color:var(--muted);font-size:var(--t1)}
.dr-h h3{margin:4px 0 0;font-size:var(--t5)}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:4px;padding:12px;text-align:center}
.box b{display:block;font-size:var(--t4);font-variant-numeric:tabular-nums}
.box>span{display:block;color:var(--muted);font-size:var(--t1);margin-top:4px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h4{margin:0;font-size:var(--t2);color:var(--muted);font-weight:700}
.ytd{border:1px solid var(--line);border-radius:4px;padding:12px 10px 6px;height:240px}
.ytd svg{display:block;width:100%;height:100%}
table.ft{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:4px}
.ft th{background:var(--head);color:var(--muted);font-weight:700;font-size:var(--t1);text-align:right;padding:11px 14px;border-bottom:1px solid var(--line)}
.ft td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ft th:first-child,.ft td:first-child{text-align:left}
.ft tfoot td{font-weight:700;background:var(--head);border-bottom:0}


@media (max-width:900px){.sum{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.kpi:nth-child(3){border-left:0}}
@media (max-width:660px){.dr-close{right:12px;top:12px;background:var(--track);color:var(--fg)}.boxes{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.sum{grid-template-columns:minmax(0,1fr)}.kpi{border-left:0}.dd{max-width:100%}}

/* Ajuste à tela: a página ocupa exatamente a janela e encolhe medidas proporcionalmente */
@media (min-width:1101px) and (min-height:640px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .content{flex:1;min-height:0;display:flex;padding-block:clamp(10px,1.6vh,20px)}
  .stack{flex:1;min-height:0;width:100%;gap:clamp(8px,1.4vh,16px)}
  .main{flex:1;min-height:0;height:auto;grid-template-columns:minmax(0,1fr) clamp(340px,27vw,500px);gap:clamp(10px,1vw,16px)}
}
.topbar .wrap{height:clamp(46px,5.6vh,60px)}
.brand{}
.filters .wrap{padding-block:clamp(6px,.9vh,10px)}
.dd{height:clamp(30px,3.3vh,36px)}
.ttl h1{}
.ttl p{}
.sum{padding:clamp(10px,1.6vh,18px) 0}
.kpi{padding:0 clamp(12px,1.3vw,24px);gap:clamp(2px,.5vh,6px)}
.kpi .v{}
.kpi .k,.kpi .d{}
.kpi.ring svg{width:clamp(44px,3.4vw,64px);height:auto}
.ph{padding:clamp(10px,1.4vh,16px) clamp(12px,1.1vw,20px) clamp(8px,1vh,12px)}
table.mx{min-width:0}
.mx th,.mx td{padding-left:clamp(6px,.8vw,18px);padding-right:clamp(6px,.8vw,18px);}
.mx th{height:clamp(34px,4vh,44px);padding-top:8px;padding-bottom:8px}
.mx tr.s td,.mx tr.g td{height:clamp(42px,5.2vh,58px)}
.mx tr.s td:first-child,.mx tr.g td:first-child{}
.mx th:first-child,.mx td:first-child{padding-left:clamp(12px,1.1vw,20px)}
.mx tr.g td:first-child{padding-left:clamp(44px,3vw,58px)}
.mx tfoot td{height:clamp(40px,4.6vh,50px)}
.li{padding:clamp(7px,1vh,11px) clamp(12px,1.1vw,20px)}
.li .n,.li .val{}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr);height:auto}.mx-wrap{max-height:640px}.side>.card{min-height:340px}table.mx{min-width:720px}}

/* Barras de rolagem discretas */
:root{--sb:rgba(120,128,124,.35);--sb-h:rgba(120,128,124,.6)}
@supports not selector(::-webkit-scrollbar){.mx-wrap,.list,.opts,.drawer{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
.mx-wrap::-webkit-scrollbar,.list::-webkit-scrollbar,.opts::-webkit-scrollbar,.drawer::-webkit-scrollbar{width:8px;height:8px}
.mx-wrap::-webkit-scrollbar-track,.list::-webkit-scrollbar-track,.opts::-webkit-scrollbar-track,.drawer::-webkit-scrollbar-track{background:transparent}
.mx-wrap::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb,.opts::-webkit-scrollbar-thumb,.drawer::-webkit-scrollbar-thumb{background:var(--sb);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.mx-wrap::-webkit-scrollbar-thumb:hover,.list::-webkit-scrollbar-thumb:hover,.opts::-webkit-scrollbar-thumb:hover,.drawer::-webkit-scrollbar-thumb:hover{background:var(--sb-h);background-clip:padding-box}
.mx-wrap::-webkit-scrollbar-button,.list::-webkit-scrollbar-button,.opts::-webkit-scrollbar-button,.drawer::-webkit-scrollbar-button{display:none;height:0;width:0}
.mx-wrap::-webkit-scrollbar-corner{background:transparent}
/* Linhas abertas e fechadas com a mesma altura; rolagem sem deslocar colunas */
.mx-wrap{scrollbar-gutter:stable}
.mx tr.s td,.mx tr.g td{height:clamp(56px,6vh,64px)}
.mx th.cq,.mx td.cq{text-align:center}
/* Transição suave entre Acumulado e Mês a mês; linha do total sem traço duplo */
.mx-wrap.swap #mx{animation:mxIn .22s ease-out}
@keyframes mxIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mx td:first-child,.mx th:first-child{min-width:clamp(230px,17vw,300px)}
.mx tfoot td{border-top:0;box-shadow:0 -1px 0 var(--line)}
.mx.mv td:first-child{background:var(--surface)}
.mx.mv tr.g td:first-child{background:var(--hover)}
.mx.mv tr.g:hover td:first-child{background:var(--accent-soft)}
.mx.mv tfoot td:first-child{background:var(--head)}
.mx-wrap::-webkit-scrollbar-thumb:horizontal{border-radius:8px}
.cqs{display:block;font-size:var(--t1);margin-top:2px;font-weight:400}
.cqs .up,.cqs .down,.cqs .dash{font-size:var(--t1)}
.mx.mv th:not(:first-child),.mx.mv td:not(:first-child){text-align:center;min-width:120px}
.upd{margin-left:auto;font-size:var(--t2);color:var(--muted)}
.mx tbody td:first-child{white-space:normal;max-width:clamp(230px,19vw,340px);line-height:1.3}
/* Expandir para cima */
.xbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.xbtn:hover{color:var(--accent);border-color:var(--accent)}
.xbtn svg{transition:transform .2s}
.xbtn.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.xbtn.on svg{transform:rotate(180deg)}
.ph:has(.xbtn)>.xbtn{margin-left:auto}
body.x-mx .side{display:none}
body.x-mx .main{grid-template-columns:minmax(0,1fr)!important}
.list{overflow:hidden!important;flex:1;display:flex;flex-direction:column}
.list .li{flex:1 1 auto}
.list.measure .li{flex:0 0 auto}
.list .li.last{border-bottom:0}
.drawer{overflow:hidden!important;gap:clamp(12px,2vh,20px)}
.drawer .sec.fin{flex:1;min-height:0;display:flex;flex-direction:column}
.sec-t{display:inline-flex;align-items:center;gap:10px}
.ftw{flex:1;min-height:0;overflow:hidden}
.ftw.scroll{overflow:auto}
.drawer.xf .boxes,.drawer.xf .ytds{display:none}
#chartCard[hidden]+#topCard{flex:1!important}
.ft td:not(:first-child){white-space:nowrap}
.sico{width:clamp(30px,2.1vw,36px);height:clamp(30px,2.1vw,36px);border-radius:8px;display:grid;place-items:center;flex:none}
.kpi.ring .sico svg{width:62%;height:62%}
.sico.ok{background:var(--accent-soft);color:var(--accent)}
.sico.warn{background:#FFF4D6;color:#9A6B00}
.sico.bad{background:#FBE7E4;color:var(--neg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sico.warn{background:#3A2F14;color:#F2C14E}:root:not([data-theme="light"]) .sico.bad{background:#3A2220}}
:root[data-theme="dark"] .sico.warn{background:#3A2F14;color:#F2C14E}:root[data-theme="dark"] .sico.bad{background:#3A2220}
@media (prefers-reduced-motion:reduce){.mx-wrap.swap #mx{animation:none}}
.ft th:not(:first-child),.ft td:not(:first-child),.mx th:not(:first-child),.mx td:not(:first-child){text-align:center!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Moedas caindo e empilhando (só transform/opacity: continua animando mesmo com o navegador ocupado) */
.coins{position:relative;width:96px;height:64px}
.coins .stack{position:absolute;left:50%;bottom:4px;width:64px;height:48px;margin-left:-32px;will-change:transform;animation:cstk 1.4s cubic-bezier(.3,0,.3,1) infinite}
.coins .stack i{position:absolute;left:0;width:64px;height:18px;border-radius:50%;background:var(--accent);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 0 0 2px var(--bg);will-change:opacity}
.coins .stack i:nth-child(1){bottom:0;animation:cfo 1.4s infinite}
.coins .stack i:nth-child(2){bottom:10px}
.coins .stack i:nth-child(3){bottom:20px}
.coins .stack i:nth-child(4){bottom:30px;will-change:transform,opacity;animation:cfi 1.4s cubic-bezier(.3,0,.3,1) infinite}

<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const BRL0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const PCT=new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mLabel=k=>{const[y,m]=k.split('-');return MES[+m-1]+'/'+y.slice(2)};
const lyKey=k=>(+k.slice(0,4)-1)+k.slice(4);
const compact=v=>{const a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(a>=1e3)return s+'R$ '+Math.round(a/1e3)+' mil';return s+'R$ '+Math.round(a)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const LOW=new Set(['de','da','do','das','dos','e','em','com','a','o','as','os','para','por','na','no']);
const tc=s=>{s=String(s);if(s!==s.toUpperCase()||!/[A-ZÀ-Ý]{5,}/.test(s))return s;return s.toLowerCase().split(' ').map((w,i)=>i>0&&LOW.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ')};

const S={rows:[],months:[],F:{f:new Set(),s:new Set(),g:new Set(),m:new Set()},open:new Set(),view:'acc',rec:'receita',dr:null};

/* ---------- Dados de exemplo (24 meses) ---------- */
function sample(){
  let a=20261015;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const fil=[['Matriz',.55],['Filial Campinas',.27],['Filial Curitiba',.18]];
  const pickF=()=>{let x=rnd(),c=0;for(const[f,w]of fil){c+=w;if(x<=c)return f}return fil[0][0]};
  const plan=[
    ['RECEITAS OPERACIONAIS',[['Vendas de Produtos',240000,['Venda à vista','Venda a prazo (boleto)','Venda cartão de crédito']],['Prestação de Serviços',118000,['Manutenção','Consultoria','Instalação']],['Contratos Recorrentes',64000,['Mensalidade de suporte','Licenciamento']]]],
    ['RECEITAS FINANCEIRAS',[['Rendimentos de Aplicações',9200,['CDB','Fundo DI']],['Juros Recebidos',2600,['Juros de clientes','Multas recebidas']]]],
    ['DESPESAS COM PESSOAL',[['Salários',132000,['Folha mensal','Horas extras','Pró-labore']],['Encargos Sociais',46000,['INSS','FGTS']],['Benefícios',21000,['Vale-refeição','Plano de saúde','Vale-transporte']]]],
    ['DESPESAS ADMINISTRATIVAS',[['Aluguel',28000,['Aluguel matriz','Aluguel filiais','Condomínio']],['Energia e Água',7400,['Energia elétrica','Água e esgoto']],['Software e Licenças',12600,['ERP','Pacote de escritório','Outras licenças']],['Material de Escritório',2900,['Papelaria','Copa e limpeza']]]],
    ['DESPESAS COMERCIAIS',[['Comissões',23500,['Comissão de vendedores','Comissão de representantes']],['Marketing',19800,['Mídia paga','Eventos','Agência']],['Fretes',14200,['Frete de vendas','Frete de compras']]]],
    ['IMPOSTOS E TRIBUTOS',[['Simples Nacional / ICMS',38500,['DAS','ICMS ST']],['ISS',8700,['ISS próprio','ISS retido']],['IRPJ / CSLL',15400,['IRPJ','CSLL']]]],
    ['INVESTIMENTOS',[['Equipamentos',9000,['Computadores','Máquinas']],['Reformas e Benfeitorias',5000,['Obras','Mobiliário']]]]
  ];
  const out=[];
  for(let i=0;i<24;i++){
    const d=new Date(2024,10+i,1),y=d.getFullYear(),m=d.getMonth()+1;
    const season=(1+0.08*Math.sin((m-3)/12*2*Math.PI))*(0.9+i*0.0085);
    plan.forEach(([sint,gers])=>{const rec=/receita/i.test(sint);
      gers.forEach(([g,base,fins])=>{
        let tot=base*season*(0.86+rnd()*0.28);
        if(sint==='INVESTIMENTOS'&&(m===2||m===7))tot*=4.2;
        if((g==='Benefícios'||g==='Salários')&&m===12)tot*=1.5;
        const n=3+Math.floor(rnd()*3);let left=tot;
        for(let j=0;j<n;j++){const part=j===n-1?left:left*(0.2+rnd()*0.35);left-=part;
          const c=fins[rnd()<.5?0:Math.floor(rnd()*fins.length)];
          const day=1+Math.floor(rnd()*27);
          out.push({d:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,f:pickF(),s:sint,g,c,p:rec?0:+part.toFixed(2),r:rec?+part.toFixed(2):0});}
      });});
  }
  return out;
}

/* ---------- Estado e filtros ---------- */
function load(rows){
  if(S.dr)closeDrawer();
  S.rows=rows;S.months=[...new Set(rows.map(r=>r.d.slice(0,7)))].sort();
  S.F={f:new Set(),s:new Set(),g:new Set(),m:new Set(S.months.slice(-1))};S.open=new Set();render();
}
const isRec=s=>new RegExp(S.rec,'i').test(s);
const uniq=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,'pt-BR'));
const pass=(r,k)=>{const set=S.F[k];if(!set.size)return true;return set.has(k==='m'?r.d.slice(0,7):r[k])};
const opts={f:()=>uniq(S.rows.map(r=>r.f)),s:()=>uniq(S.rows.filter(r=>pass(r,'f')).map(r=>r.s)),g:()=>uniq(S.rows.filter(r=>pass(r,'f')&&pass(r,'s')).map(r=>r.g)),m:()=>S.months.slice()};
const selMonths=()=>S.F.m.size?new Set([...S.F.m].filter(k=>S.months.includes(k))):new Set(S.months);
function prune(){for(const k of['s','g']){const ok=new Set(opts[k]());for(const v of[...S.F[k]])if(!ok.has(v))S.F[k].delete(v)}}

function aggregate(){
  const tree=new Map();const add=(o,k,v)=>{o.bm[k]=(o.bm[k]||0)+v};
  for(const r of S.rows){if(!pass(r,'f')||!pass(r,'s')||!pass(r,'g'))continue;
    const mk=r.d.slice(0,7);const rec=isRec(r.s);const v=rec?r.r:r.p;
    if(!tree.has(r.s))tree.set(r.s,{name:r.s,rec,gers:new Map(),bm:{}});
    const s=tree.get(r.s);add(s,mk,v);
    if(!s.gers.has(r.g))s.gers.set(r.g,{name:r.g,s:r.s,rec,fins:new Map(),bm:{}});
    const g=s.gers.get(r.g);add(g,mk,v);
    const cn=r.c||'(sem classe financeira)';if(!g.fins.has(cn))g.fins.set(cn,{name:cn,bm:{}});add(g.fins.get(cn),mk,v);}
  return tree;
}
const sumSel=(bm,set)=>{let t=0;for(const k of set)t+=bm[k]||0;return t};
const lySet=set=>new Set([...set].map(lyKey));
function totalsFor(tree,set){let r=0,p=0;for(const s of tree.values()){const v=sumSel(s.bm,set);s.rec?r+=v:p+=v}return{r,p,s:r-p}}
function prevSet(sel){const ss=[...sel].sort();if(!ss.length||sel.size===S.months.length)return null;const i0=S.months.indexOf(ss[0]),i1=S.months.indexOf(ss[ss.length-1]);
  const n=i1-i0+1;if(n!==ss.length||i0-n<0)return null;return new Set(S.months.slice(i0-n,i0))}
function periodText(sel){const ss=[...sel].sort();if(!ss.length)return'';if(ss.length===1){const[y,m]=ss[0].split('-');return MESL[+m-1]+' de '+y}
  const i0=S.months.indexOf(ss[0]),i1=S.months.indexOf(ss[ss.length-1]);
  return i1-i0+1===ss.length?mLabel(ss[0])+' a '+mLabel(ss[ss.length-1]):ss.length+' meses selecionados'}
function cq(cur,ly,rec){if(!ly)return'<span class="dash">—</span>';const d=(cur-ly)/Math.abs(ly);const good=rec?d>=0:d<=0;return`<span class="${good?'up':'down'}">${d>=0?'▲':'▼'} ${PCT.format(Math.abs(d))}</span>`}

/* ---------- Render ---------- */
const DDN={f:['Filial','Todas'],s:['Classe sintética','Todas'],g:['Classe gerencial','Todas'],m:['Ano/Mês','Todos']};
function ddLabels(){for(const k of['f','s','g','m']){const set=S.F[k],all=opts[k]();const full=!set.size||set.size>=all.length;
  let v=DDN[k][1];if(!full){if(set.size===1){const x=[...set][0];v=k==='m'?mLabel(x):tc(x)}else v=k==='m'?periodText(set):set.size+' selecionadas'}
  $('#dd-'+k).innerHTML=`<span class="k">${DDN[k][0]}:</span><span class="v">${esc(v)}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>`;}}

const chev=open=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>`;
function statusIcon(c){const st=c>1?'bad':c>.9?'warn':'ok';const t={bad:'Pagamentos acima dos recebimentos',warn:'Pagamentos próximos dos recebimentos',ok:'Pagamentos abaixo dos recebimentos'}[st];
  const g=st==='ok'?'<path d="m8.5 12.2 2.4 2.4 4.6-4.8"/>':'<path d="M12 7.6v5.2"/><circle cx="12" cy="16.2" r=".6" fill="currentColor"/>';
  return`<span class="sico ${st}" title="${t}" role="img" aria-label="${t}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/>${g}</svg></span>`}
function render(){
  if(S.x)applyX();prune();ddLabels();
  const tree=aggregate();const sel=selMonths();const nSel=sel.size||1;const ly=lySet(sel);
  $('#subtitle').textContent=`Acumulado de ${periodText(sel)||'nenhum mês'} · ${sel.size} ${sel.size===1?'mês':'meses'}`;
  // resumo
  const T=totalsFor(tree,sel);const ps=prevSet(sel);const P=ps?totalsFor(tree,ps):null;
  const none='<span class="d">Sem período anterior equivalente</span>';
  const delta=(cur,prev,goodUp)=>{if(!P||!prev)return none;const d=(cur-prev)/Math.abs(prev);const good=goodUp?d>=0:d<=0;return`<span class="d"><b class="${good?'up':'down'}">${d>=0?'▲':'▼'} ${PCT.format(Math.abs(d))}</b> vs período anterior</span>`};
  const comp=T.r?T.p/T.r:0;const pc=P&&P.r?P.p/P.r:null;const ringCol=comp>1?'var(--neg)':comp>.9?'var(--pag)':'var(--accent)';const R=26,C=2*Math.PI*R;
  $('#kpis').innerHTML=`
   <div class="kpi"><span class="k">Recebimentos</span><span class="v">${BRL.format(T.r)}</span>${delta(T.r,P&&P.r,true)}</div>
   <div class="kpi"><span class="k">Pagamentos</span><span class="v">${BRL.format(T.p)}</span>${delta(T.p,P&&P.p,false)}</div>
   <div class="kpi"><span class="k">Saldo do período</span><span class="v ${T.s>=0?'up':'down'}">${BRL.format(T.s)}</span>${delta(T.s,P&&P.s,true)}</div>
   <div class="kpi ring">${statusIcon(comp)}
     <div style="display:flex;flex-direction:column;gap:6px"><span class="k">Comprometimento (pag. ÷ receb.)</span><span class="v">${PCT.format(comp)}</span>${pc===null?none:`<span class="d"><b class="${comp<=pc?'up':'down'}">${comp>=pc?'▲':'▼'} ${(Math.abs(comp-pc)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})} p.p.</b> vs período anterior</span>`}</div></div>`;
  // matriz
  const sints=[...tree.values()].map(s=>({...s,v:sumSel(s.bm,sel)})).sort((a,b)=>(b.rec-a.rec)||(b.v-a.v));
  const gFiltered=S.F.g.size>0;const mv=S.view==='mes';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  $('#mx').classList.toggle('mv',mv);
  let cols,cells,head,foot,sub;
  if(!mv){
    head=`<tr><th>Classe sintética / gerencial</th><th>Recebimento</th><th>Pagamento</th><th>Saldo</th><th>% do total</th><th>Média mensal</th><th class="cq">C/Q % vs ano anterior</th></tr>`;cols=7;
    cells=o=>{const v=sumSel(o.bm,sel);const tot=o.rec?T.r:T.p;
      return`<td class="${o.rec?'':'dash'}">${o.rec?BRL.format(v):'—'}</td><td class="${o.rec?'dash':''}">${o.rec?'—':BRL.format(v)}</td>
      <td class="${o.rec?'up':'down'}">${o.rec?'+':'−'} ${BRL.format(Math.abs(v))}</td><td>${PCT.format(tot?v/tot:0)}</td><td>${BRL.format(v/nSel)}</td><td class="cq">${cq(v,sumSel(o.bm,ly),o.rec)}</td>`};
    const TL=totalsFor(tree,ly);

/* ---------- Gráfico de linhas ---------- */
function nice(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function lineSvg(W,H,labels,series,o={}){
  const L=74,R=14,Tp=12,B=26;const iw=W-L-R,ih=H-Tp-B;const n=labels.length;
  let hi=Math.max(1,...series.flatMap(s=>s.vals.filter(v=>v!=null)));const step=nice(hi/4);hi=Math.ceil(hi/step)*step;
  const x=i=>n<2?L+iw/2:L+iw*i/(n-1),y=v=>Tp+ih-v/hi*ih;const bw=n<2?iw:iw/(n-1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Gráfico de linhas')}">`;
  if(o.band)o.band.forEach((on,i)=>{if(on)s+=`<rect x="${Math.max(L,x(i)-bw/2)}" y="${Tp}" width="${Math.min(bw,W-R-Math.max(L,x(i)-bw/2),x(i)+bw/2-L)}" height="${ih}" fill="var(--accent-soft)"/>`});
  for(let v=0;v<=hi+1e-6;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)">${compact(v)}</text>`;
  series.forEach(se=>{const pts=se.vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    if(pts.length===1)s+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="4" fill="${se.color}"/>`;
    if(se.fill)s+=`<path d="M${pts[0][0]},${y(0)} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(0)}Z" fill="${se.color}" fill-opacity=".09"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="${se.dash?1.6:2.2}" ${se.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  labels.forEach((l,i)=>{s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="${o.band&&o.band[i]?'var(--fg)':'var(--muted)'}" font-weight="${o.band&&o.band[i]?700:400}">${l}</text>`});
  if(o.hit)labels.forEach((l,i)=>{s+=`<rect class="hit" data-i="${i}" x="${x(i)-bw/2}" y="${Tp}" width="${bw}" height="${ih+B}" fill="transparent" style="cursor:default"/>`});
  return s+'</svg>';
}
function mLabels(ks){const multi=new Set(ks.map(k=>k.slice(0,4))).size>1;return ks.map(k=>multi?mLabel(k):MES[+k.slice(5)-1])}

    [{vals:data.map(d=>d.r),color:'var(--accent)',fill:true},{vals:data.map(d=>d.p),color:'var(--pag)',fill:true}],
    {hit:true,aria:'Recebimentos e pagamentos por mês'});

}

  const wb=XLSX.read(buf,{type:'array',cellDates:true,dense:true});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});const hdr=(rows[0]||[]).map(h=>String(h||'').trim());const ix={};
  for(const[k,n]of Object.entries(COL)){ix[k]=hdr.indexOf(n);if(ix[k]<0)throw new Error('Coluna não encontrada na planilha: '+n)}
  const agg=new Map();
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r)continue;const m=mesDe(r[ix.data]);if(!m)continue;
    const k=[m,txt(r[ix.filial],'(Sem filial)'),txt(r[ix.sintetica],'(Sem categoria)'),txt(r[ix.gerencial],'(Sem categoria)'),txt(r[ix.financeira],'(Sem classe financeira)')].join('\t');
    const a=agg.get(k)||[0,0];a[0]+=numv(r[ix.pagamento]);a[1]+=numv(r[ix.recebimento]);agg.set(k,a)}
  return[...agg.entries()].map(([k,v])=>[...k.split('\t'),v[0],v[1]]);
}
const fmtData=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
// Lê a planilha em segundo plano (Web Worker) para a tela não congelar
function lerNoWorker(buf){
  const src=`importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
const p2=${p2};${mesDe};const txt=${txt};const numv=${numv};const COL=${JSON.stringify(COL)};${agregarPlanilha}
onmessage=e=>{try{postMessage({ok:agregarPlanilha(e.data)})}catch(err){postMessage({err:err.message})}}`;
  return new Promise((ok,er)=>{let w;try{w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){er(e);return}
    w.onmessage=e=>{w.terminate();e.data.err?er(new Error(e.data.err)):ok(e.data.ok)};
    w.onerror=e=>{w.terminate();er(new Error(e.message||'falha no leitor'))};
    w.postMessage(buf,[buf])});
}
async function baixar(r,onp){
  const total=+r.headers.get('content-length')||0;if(!r.body||!r.body.getReader){const b=await r.arrayBuffer();onp(1);return b}
  const rd=r.body.getReader();const parts=[];let got=0;
  for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onp(total?got/total:0,got)}
  const out=new Uint8Array(got);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out.buffer;
}
async function loadData(){
  const up=$('#upd');
  if(!CFG.container.trim()){up.textContent='Fonte de dados não configurada: preencha o config.js';return}
  up.textContent='Carregando dados…';
  const sp=document.getElementById('spSt'),bar=document.getElementById('spBar');
  const fase=(t,p)=>{sp.textContent=t;if(p==null){bar.classList.add('ind')}else{bar.classList.remove('ind');bar.style.setProperty('--p',p)}};
  try{
    fase('Conectando à base…');
    let r;try{r=await fetch(arquivoUrl(),{cache:'no-store'})}catch(e){throw new Error('o navegador não conseguiu acessar o container. Confira o CORS da conta de armazenamento.')}
    if(r.status===404)throw new Error(`arquivo "${CFG.arquivo}" não encontrado no container.`);
    if(r.status===403)throw new Error('acesso negado. A URL SAS pode ter vencido ou não tem permissão de leitura.');
    if(!r.ok)throw new Error('o container respondeu com erro '+r.status+'.');
    const lm=r.headers.get('last-modified');let linhas,quando=lm?fmtData(new Date(lm)):'';
    const buf=await baixar(r,(f,got)=>f?fase(`Baixando dados · ${Math.round(f*100)}%`,f):fase(`Baixando dados · ${(got/1048576).toFixed(1).replace('.',',')} MB`));
    if(/\.json$/i.test(CFG.arquivo)){fase('Organizando os números…');const j=JSON.parse(new TextDecoder().decode(buf).replace(/^﻿/,''));linhas=j.linhas;if(!quando)quando=j.geradoEm||'';}
    else{up.textContent='Lendo a planilha…';fase('Organizando os números…');
      try{linhas=await lerNoWorker(buf.slice(0))}catch(e){if(/Coluna/.test(e.message))throw e;await carregarXLSX();linhas=agregarPlanilha(buf)}}
    if(!Array.isArray(linhas)||!linhas.length)throw new Error('o arquivo não tem lançamentos.');
    fase('Montando o painel…',1);
    load(linhas.map(l=>({d:l[0]+'-01',f:l[1],s:l[2],g:l[3],c:l[4],p:+l[5]||0,r:+l[6]||0})));
    up.textContent='Base atualizada em '+(quando||'—');
  }catch(err){up.textContent='Erro ao carregar os dados: '+err.message}
}
loadData().finally(()=>window.gfReady&&gfReady());
})();
